# ── Nginx SPA Configuration for Multi-Tenant Portfolio SaaS ─────
server {
    # Railway injects PORT; the Dockerfile default keeps local Compose on :80.
    listen ${PORT};
    server_name _;

    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
    gzip_vary on;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"           always;
    add_header X-Content-Type-Options    "nosniff"              always;
    add_header X-XSS-Protection          "1; mode=block"        always;
    add_header Referrer-Policy           "strict-origin"        always;
    add_header Permissions-Policy        "geolocation=()"       always;

    # Cache static assets aggressively (Vite fingerprints filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy /api requests to backend Express server
    # Works seamlessly in both Railway and Local Docker environments
    location /api/ {
        proxy_pass         http://${BACKEND_HOST}/api/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Proxy /uploads requests to backend static file serving
    # ^~ forces Nginx to prefer this prefix location over regex static asset rules (~* \.jpg$)
    location ^~ /uploads/ {
        proxy_pass         http://${BACKEND_HOST}/uploads/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Proxy SEO Discovery endpoints to backend
    location = /sitemap.xml {
        proxy_pass         http://${BACKEND_HOST}/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location = /robots.txt {
        proxy_pass         http://${BACKEND_HOST}/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # SPA fallback — all unknown routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
