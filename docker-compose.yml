# ─────────────────────────────────────────────────────────────
#  Multi-Tenant Portfolio SaaS — Docker Compose (Production)
#
#  Services:
#    postgres   → PostgreSQL 16 (persisted volume)
#    redis      → Redis 7 (rate limiting / caching)
#    backend    → Node.js Express API  (:3000)
#    frontend   → Nginx + React SPA    (:80)
#
#  Usage:
#    docker compose up --build -d
#    docker compose exec backend node dist/database/seed.js
# ─────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: portfolio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio_secret}
      POSTGRES_DB:       ${POSTGRES_DB:-portfolio_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio} -d ${POSTGRES_DB:-portfolio_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portfolio_net

  # ── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: portfolio_redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - portfolio_net

  # ── Backend (Express API) ─────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV:             production
      PORT:                 3000
      DATABASE_URL:         postgresql://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD:-portfolio_secret}@postgres:5432/${POSTGRES_DB:-portfolio_db}
      REDIS_URL:            redis://redis:6379
      JWT_SECRET:           ${JWT_SECRET:-super_secret_change_in_production}
      JWT_REFRESH_SECRET:   ${JWT_REFRESH_SECRET:-super_secret_refresh_change_in_production}
      JWT_EXPIRES_IN:       ${JWT_EXPIRES_IN:-7d}
      SESSION_SECRET:       ${SESSION_SECRET:-portfolio_session_secret_key_2024!}
      PLATFORM_DOMAIN:      ${PLATFORM_DOMAIN:-localhost}
      FRONTEND_URL:         ${FRONTEND_URL:-http://localhost:3080}
      BACKEND_URL:          ${BACKEND_URL:-http://localhost:5000}
      CORS_ORIGIN:          ${CORS_ORIGIN:-http://localhost:3080,http://localhost:5000,http://localhost:3000}
      GOOGLE_CLIENT_ID:     ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID:     ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      AI_API_KEY:           ${AI_API_KEY:-}
      AI_PROVIDER:          ${AI_PROVIDER:-gemini}
      EXTRACTION_ENGINE:    ${EXTRACTION_ENGINE:-gemini}
      GEMINI_API_KEY:       ${GEMINI_API_KEY:-}
      GEMINI_MODEL:         ${GEMINI_MODEL:-gemini-3.6-flash}
      SMTP_HOST:            ${SMTP_HOST:-}
      SMTP_PORT:            ${SMTP_PORT:-587}
      SMTP_USER:            ${SMTP_USER:-}
      SMTP_PASS:            ${SMTP_PASS:-}
    volumes:
      - uploads_data:/app/uploads         # Persist uploaded CV files
    ports:
      - "5000:3000"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      portfolio_net:
        aliases:
          - backend

  # ── Frontend (Nginx + Vite SPA) ───────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portfolio_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - BACKEND_HOST=backend:3000
      - PORT=80
    ports:
      - "0.0.0.0:3080:80"
    networks:
      portfolio_net:
        aliases:
          - frontend


# ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  portfolio_net:
    driver: bridge
